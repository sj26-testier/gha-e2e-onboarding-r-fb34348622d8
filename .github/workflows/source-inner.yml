{
  "name": "source-inner",
  "on": {
    "workflow_call": {
      "inputs": {
        "expected_source": {
          "type": "string",
          "required": true
        },
        "expected_secret": {
          "type": "string",
          "default": "absent"
        }
      }
    }
  },
  "jobs": {
    "nested": {
      "uses": "$/.github/workflows/leaf.yml",
      "with": {
        "expected_source": "${{ inputs.expected_source }}",
        "expected_secret": "${{ inputs.expected_secret }}"
      }
    }
  }
}
